name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.os }}, Pi ${{ matrix.pi }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pi: ['1.3.0', '1.4.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: npm run check
      - run: npm run behavior
      - run: npm run verify:package
